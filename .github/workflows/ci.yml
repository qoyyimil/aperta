name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/mago guard
      - run: vendor/bin/mago lint
      - run: vendor/bin/mago analyze
      - run: vendor/bin/mago format --check
      - run: composer audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aperta_test
          POSTGRES_USER: aperta
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: aperta
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, gd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      # Halaman Inertia butuh manifest Vite saat dites.
      - run: npm ci && npm run build
      - run: php artisan test
